name: 로또 최신 수집

on:
  schedule:
    - cron: '0 12 * * 0'  # 매주 일요일 21:00 KST (UTC 12:00)
  workflow_dispatch:       # 수동/버튼 트리거

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 수집 로직을 여기 인라인으로 복사하지 말 것.
      # 과거 이 자리에 네이버 스크래퍼가 auto_fetch.py와 중복 복사돼 있었고,
      # 두 벌이 따로 낡으면서 어느 쪽이 진짜인지 알 수 없게 됐다.
      # 수집·채점의 단일 원천은 accumulate.sync() 하나다.
      - name: 최신 회차 수집 (당첨번호 + 당첨금 + 성적표)
        run: python -X utf8 auto_fetch.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # 존재하는 파일만 스테이징한다. pathspec 하나라도 없으면 git add는
          # rc=128로 죽고, 그러면 실제로 갱신된 나머지 파일까지 커밋되지 않는다.
          for f in lotto645_전체.csv lotto645_당첨금.csv scoreboard.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && echo "추가 없음, 커밋 스킵" && exit 0
          git commit -m "자동 수집: 당첨번호·당첨금·성적표 갱신"
          git push
